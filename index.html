<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Finder</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container">
    <h1>Recipe Finder</h1>

    <div class="search-box">
      <input
        type="text"
        id="search-input"
        placeholder="Search by name (eg. 'carrot')"
      />
      <button id="search-btn">Search</button>
    </div>

    <button id="random-btn" class="random-btn">Get Random Recipe</button>

    <p id="message" class="message">Search for a recipe or get a random one!</p>

    <div id="recipe-result"></div>
  </main>

  <script src="/script.js"></script>
</body>
</html>
